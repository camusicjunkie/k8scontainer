apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: roster
  namespace: devcontainer
spec:
  type: Static
  defaultValues:
    image: harbor.example/devcontainer/standard:0.2.0
    admins:
      - name: bob
        port: 2202
        publicKey: ssh-rsa  bob-piv-placeholder
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits: { cpu: "4", memory: 8Gi }
