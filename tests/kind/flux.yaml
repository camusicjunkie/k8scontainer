# What tests/kind/up.sh applies when GIT_URL is set, shaped as the Management
# Cluster should run it: Flux syncs manifests/devcontainer from GIT_BRANCH
# with a read-only credential, and the image automation commits Roster
# updates to GIT_PUSH_BRANCH with its own write credential, for someone to
# merge. envsubst fills ${...}.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: k8scontainer
  namespace: flux-system
spec:
  interval: 1m
  url: ${GIT_URL}
  ref:
    branch: ${GIT_BRANCH}
  secretRef:
    name: devc-git-read
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devcontainer
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: k8scontainer
  path: ./manifests/devcontainer
  patches:
    # This registry in place of harbor.example, scanned over plain HTTP.
    - target: { kind: ImageRepository, name: devcontainer-standard }
      patch: |
        - { op: replace, path: /spec/image, value: ${REGISTRY}/${HARBOR_PROJECT}/devcontainer/standard }
        - { op: add, path: /spec/insecure, value: true }
    # The test's own key in place of the placeholder.
    - target: { kind: ResourceSetInputProvider, name: roster }
      patch: |
        - { op: replace, path: /spec/defaultValues/admins/0/publicKey, value: "${TEST_PUBKEY}" }
---
# The automation and its source sit in the devcontainer namespace: an
# ImageUpdateAutomation applies only the ImagePolicies in its own namespace
# (the Roster's marker names devcontainer:devcontainer-standard), and a
# source beside it needs no cross-namespace reference.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: k8scontainer-push
  namespace: devcontainer
spec:
  interval: 10m
  url: ${GIT_URL}
  ref:
    branch: ${GIT_BRANCH}
  secretRef:
    name: devc-git-push
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: devcontainer
  namespace: devcontainer
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: k8scontainer-push
  git:
    checkout:
      ref:
        branch: ${GIT_BRANCH}
    commit:
      author: { email: fluxcdbot@users.noreply.github.com, name: fluxcdbot }
      # Only the Roster changes, so no image build; merging runs the pipeline.
      messageTemplate: "chore(images): update automated image tags [skip ci]"
    push:
      branch: ${GIT_PUSH_BRANCH}
  update:
    path: ./manifests/devcontainer
    strategy: Setters
