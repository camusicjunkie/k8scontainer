# The Roster: the admins entitled to a Devcontainer Pod. Adding an entry and
# merging provisions their Pod, volume, key list, Service and Gateway route;
# removing one deprovisions them (the ResourceSet prunes what it generated).
#
# Per admin:
#   name       DNS label, unique; names every generated object
#   port       unique TCP port of this admin's listener on the shared Gateway
#   publicKey  the smartcard PIV Authentication public key (RSA, public only)
#   resources  optional overrides of the Pod's requests and limits
#              (any of requests.cpu, requests.memory, limits.cpu, limits.memory)
#
# A Static ResourceSetInputProvider keeps the Roster a plain file: its
# defaultValues are the single input set the ResourceSet renders from.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: roster
  namespace: devcontainer
spec:
  type: Static
  defaultValues:
    admins:
      - name: admin
        port: 2201
        # Placeholder key: its private half was discarded.
        publicKey: ssh-rsa  admin-piv-placeholder
