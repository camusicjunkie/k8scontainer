# Headless Service the StatefulSet requires (serviceName). Gateway exposure
# goes through the admin-ssh Service below.
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: devcontainer
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: devcontainer
    devcontainer/admin: admin
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
---
# What the Gateway's TCPRoute targets: a ClusterIP Service in front of the Pod.
apiVersion: v1
kind: Service
metadata:
  name: admin-ssh
  namespace: devcontainer
spec:
  selector:
    app.kubernetes.io/name: devcontainer
    devcontainer/admin: admin
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
