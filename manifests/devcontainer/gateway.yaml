# The shared Gateway: one IP, one TCP listener per admin (ADR 0001). Hard-coded
# for the single admin until the Roster generates a listener per admin.
# gatewayClassName istio: the Management Cluster's Istio provisions the
# LoadBalancer Service (the shared Gateway IP) for this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devcontainer
  namespace: devcontainer
spec:
  gatewayClassName: istio
  listeners:
    - name: ssh-admin
      protocol: TCP
      port: 2201
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Same
