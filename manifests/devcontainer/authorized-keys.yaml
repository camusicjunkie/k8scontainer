# The admin's key list (the Roster generates this later). The key below is a
# placeholder for the smartcard PIV Authentication public key (RSA, as PIV
# cards hold); its private half was discarded. Public keys only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-authorized-keys
  namespace: devcontainer
data:
  authorized_keys: |
    ssh-rsa  admin-piv-placeholder
