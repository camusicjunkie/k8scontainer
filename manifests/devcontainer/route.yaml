# TCPRoute is v1alpha2 (experimental channel), the version Istio's Gateway API
# controller serves. The backend is the ClusterIP Service, not the headless
# one the StatefulSet needs.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: admin-ssh
  namespace: devcontainer
spec:
  parentRefs:
    - name: devcontainer
      sectionName: ssh-admin
  rules:
    - backendRefs:
        - name: admin-ssh
          port: 2222
