# What Flux applies from this directory: the Site Config, the Roster, the NetworkPolicy that isolates the Pods, and the ResourceSet that
# turns the Roster into every admin's Pod, volume, key list, Service and
# Gateway route. No per-admin manifest lives here. The Devcontainer Namespace
# itself belongs to whoever syncs this directory (the Gitops repository; on
# kind, tests/kind/up.sh), so it outlives a prune and keeps the admins' volumes.
# Flux variables are each network's runtime facts (tests/site/facts.env).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - site-config.yaml
  - roster.yaml
  - image-automation.yaml
  - gateway-options.yaml
  - networkpolicy.yaml
  - resourceset.yaml
